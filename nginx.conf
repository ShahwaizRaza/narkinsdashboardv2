server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Password protect the entire site (frontend + API)
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Proxy API requests to backend (no trailing slash on proxy_pass target,
    # so /api/data on nginx maps to /api/data on Flask, matching its routes)
    location /api/ {
        proxy_pass http://narkins-backend:5000;
        proxy_set_header Host $host;
    }

    # Serve frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
